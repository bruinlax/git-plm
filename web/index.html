.gatecard .verdict.warn { background:var(--st-prototype-bg); color:#6b4400;
                          box-shadow:inset 3px 0 0 var(--st-prototype); }
.gatecard .verdict.ok { background:var(--add-wash); color:#0F5124;
                        box-shadow:inset 3px 0 0 var(--st-released); }
.gaterow { display:flex; gap:9px; align-items:baseline; flex-wrap:wrap;
           padding:6px 12px; border-bottom:1px solid var(--rule); }
.gaterow:last-child { border-bottom:none; }
.gaterow .who { font:12.5px var(--mono); min-width:190px; }
/* On a phone the path already fills the line; a 190px column there just pushes
   the pin to the far edge with a gap in the middle. */
@media (max-width: 760px) { .gaterow .who { min-width:0; } }

/* ---- the timeline ---- */
.tlrow { display:grid; grid-template-columns:22px 1fr auto; gap:4px 9px;
         padding:8px 12px; border-bottom:1px solid var(--rule); align-items:baseline; }
.tlrow:last-child { border-bottom:none; }
.tlrow .ic { text-align:center; color:var(--ink-3); font:12px var(--mono); }
.tlrow .b { min-width:0; }
.tlrow .l { font-size:12.5px; line-height:1.45; }
.tlrow .l .sha, .tlrow .l .rf { font:11.5px var(--mono); color:var(--ink-3); }
.tlrow .d { font:11.5px var(--mono); color:var(--ink-3); margin-top:2px;
            line-height:1.45; word-break:break-word; }
.tlrow > .when { font:11px var(--mono); color:var(--ink-3); flex-direction:row;
                 gap:7px; white-space:nowrap; }
.tlrow.approved .ic { color:var(--st-released); }
.tlrow.rejected .ic { color:var(--st-obsolete); }
.tlrow.submitted .ic { color:var(--blue); }
@media (max-width: 760px) {
  .tlrow { grid-template-columns:22px 1fr; }
  .tlrow > .when { grid-column:2; }
}

/* ---- the decision block ---- */
.doc.decide { border-width:2px; border-color:var(--ink); }
.doc.decide > h3 { background:var(--paper); }
.decnote { display:block; width:100%; margin:9px 0 0; min-height:62px;
           background:var(--paper); border:1px solid var(--rule-2);
           border-radius:3px; padding:7px 9px; font:12.5px var(--ui);
           resize:vertical; }
.doc.decide .acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.doc.decide .out:not(:empty) { margin-top:12px; }

/* A refusal, verbatim. Monospace, its own line breaks, a red rule down the
   side — the write path wrote a paragraph with the fix in it and the UI's job
   is to not lose a word of it. */
.refusal { border:1px solid var(--st-obsolete); background:var(--del-wash); }
.refusal .hd { display:flex; gap:8px; align-items:center; padding:7px 11px;
               border-bottom:1px solid var(--del-gutter); }
.refusal .hd .x { color:var(--st-obsolete); font-weight:700; }
.refusal .hd .lbl { color:var(--st-obsolete); }
.refusal pre { margin:0; padding:11px; font:12px/1.55 var(--mono);
               white-space:pre-wrap; word-break:break-word; color:#8A1C13;
               max-height:420px; overflow:auto; }
/* …and its opposite: what actually happened when it worked. */
.approved { border:1px solid var(--st-released); background:var(--add-wash); }
.approved .hd { display:flex; gap:8px; align-items:center; padding:7px 11px;
                border-bottom:1px solid var(--add-gutter); }
.approved .hd .x { color:var(--st-released); font-weight:700; }
.approved .hd .lbl { color:var(--st-released); }
.approved table.led td { border-bottom-color:var(--add-gutter); }
.approved .note { padding:10px 12px; }
.approved .acts { display:flex; gap:7px; padding:10px 12px; flex-wrap:wrap; }
.approved .acts .btn { text-decoration:none; }

/* ---- stage 3c: who decided, the release workflow, the policy line ----
   AUTO and BOT are deliberately loud and deliberately DIFFERENT from each
   other: "the rule Geoff wrote merged this" and "an agent decided this" are
   different sentences about accountability, and a ledger that drew them the
   same way would be worse than no ledger. The human case gets no chip at all —
   a badge on the normal path is noise, and noise is what stops people reading
   badges. */
.autochip, .botchip { font:10px var(--mono); letter-spacing:.09em;
                      text-transform:uppercase; border-radius:2px;
                      padding:1px 5px; cursor:help; white-space:nowrap; }
.autochip { border:1px solid var(--st-superseded); color:var(--st-superseded);
            background:var(--st-superseded-bg); }
.botchip  { border:1px dashed var(--blue); color:var(--blue);
            background:var(--blue-bg); }

.doc.wf .wfrow { display:flex; gap:10px; align-items:flex-start;
                 padding:8px 0; border-bottom:1px solid var(--rule); }
.doc.wf .wfrow:last-child { border-bottom:none; }
.doc.wf .wfrow .mark { font:13px var(--mono); width:1.2em; flex:none;
                       line-height:1.5; }
.doc.wf .wfrow .mark.pass { color:var(--st-released); }
.doc.wf .wfrow .mark.fail { color:var(--st-obsolete); }
.doc.wf .wfrow .mark.todo, .doc.wf .wfrow .mark.skipped { color:var(--ink-3); }
.doc.wf .wfrow .txt { min-width:0; flex:1; }
.doc.wf .wfrow .line { font-size:13px; line-height:1.45; }
.doc.wf .wfrow.done .line { color:var(--ink-2); }
.doc.wf .wfrow .by { font:11.5px var(--mono); color:var(--ink-3); margin-top:3px;
                     display:flex; gap:7px; align-items:baseline;
                     flex-wrap:wrap; }
/* `when()` stacks its two lines by default; on one line of attribution it has
   to read as part of the sentence. */
.doc.wf .wfrow .by .when { flex-direction:row; gap:7px; }
.doc.wf .wfrow .why { font-size:11.5px; color:var(--ink-3); margin-top:3px;
                      font-family:var(--sans); width:100%; }
.doc.wf .wfrow .btn { flex:none; align-self:center; }
.doc.wf .wfquorum { border-top:2px solid var(--rule-2); }
.doc.gate { border-color:var(--st-obsolete); }
.doc.gate > h3 { color:var(--st-obsolete); }

/* A 64-character sha256 in a monospace cell sets the table's minimum width and
   pushes the whole page sideways on a phone. The evidence hash IS the point of
   that row, so it wraps rather than being hidden or truncated. */
.approved table.led, .doc.gate table.led { width:100%; table-layout:fixed; }
.approved table.led td, .doc.gate table.led td { overflow-wrap:anywhere; }
.approved table.led td.dim, .doc.gate table.led td.dim { width:10em; }
@media (max-width: 560px) {
  .approved table.led td.dim, .doc.gate table.led td.dim { width:7.5em; }
}

.policyline { margin-top:9px; font:11.5px var(--mono); color:var(--ink-3);
              display:flex; gap:8px; flex-wrap:wrap; align-items:baseline;
              border-top:1px solid var(--rule); padding-top:8px; }
.policyline .k { color:var(--ink); font-weight:600; }
.policyline .v { font-family:var(--sans); font-size:12px; color:var(--ink-2);
                 flex:1; min-width:180px; }
.feedrow.relq .thumbbox .noimg { font:20px var(--mono); color:var(--ink-3); }
/* A promotion's subtitle is `v0.1.0 · prototype → released`, which is the whole
   point of the row and must not be ellipsised away. */
.feedrow.relq .who .nm { white-space:normal; overflow:visible; }
.fld { display:flex; gap:9px; align-items:baseline; margin:10px 0 0;
       flex-wrap:wrap; }
.fld .k { font:11px var(--mono); letter-spacing:.06em; text-transform:uppercase;
          color:var(--ink-3); }
/* `.pop` is `position:absolute` inside a shrink-to-fit span, so a popover with
   no width of its own collapses to the button. Every other popover here states
   one; this is the promote panel's. */
.pop.promote { width:min(430px, calc(100vw - 24px)); }
.pop.promote .decnote { min-height:78px; }
.pop.promote .acts { display:flex; gap:8px; margin-top:11px; }

/* Utility the markup already asks for (a badge with nothing to say must not
   draw a bubble in the masthead). */
.hide { display:none !important; }

/* ---- STAGE 6 HOOK (2 of 2): the approvals queue on a phone --------------
   Pre-existing and measured, not caused by checks: `.feedrow`'s four fixed-ish
   grid tracks (84px + 170px + 1fr + auto) do not fit 430 px, and the browser
   resolves it by giving `.what` a computed width of **0px**. The submission
   note, the size figures, the pin-bump chip and now the checks rollup are all
   in that column, so on a phone the queue is five thumbnails and four buttons
   and nothing to decide on — while `scrollWidth === innerWidth` stays true,
   which is why it survived stage 4's narrow pass.
   §2.8 wants the approval doable from the phone; this is the whole reason it
   is not. One stacked layout, at the END of the stylesheet so the merge is
   trivial. */
@media (max-width:560px) {
  .feedrow { grid-template-columns:84px 1fr; gap:10px 12px; align-items:start; }
  .feedrow .who  { grid-column:2; }
  .feedrow .what { grid-column:1/-1; white-space:normal; overflow:visible;
                   text-overflow:clip; }
  .feedrow .meta { grid-column:1/-1; text-align:left; align-items:stretch; }
  .feedrow .meta span { justify-content:flex-start !important; }
}

/* ---- STAGE 10: relations by home, coupons as evidence, project readiness ---- */
/* A test outcome is a stamp of its own: pass / fail / pending, never colour
   alone — the word is always there. */
.resultchip { font:10px var(--mono); letter-spacing:.06em; text-transform:uppercase;
              border:1px solid currentColor; border-radius:2px; padding:0 4px;
              margin-left:5px; white-space:nowrap; }
.resultchip.pass    { color:var(--st-released);  background:var(--st-released-bg); }
.resultchip.fail    { color:var(--st-obsolete);  background:var(--st-obsolete-bg); }
.resultchip.pending { color:var(--st-prototype); background:var(--st-prototype-bg); }
/* where a claim is recorded — and, on the inverse side, that it is derived */
.relhome { font:11px var(--mono); color:var(--ink-3); margin-top:3px;
           overflow-wrap:anywhere; }
.relline { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
.relline .relver { font:12px var(--mono); color:var(--ink-2); }
.relwhy { font-size:12px; color:var(--ink-3); margin-top:3px; line-height:1.4;
          overflow-wrap:anywhere; }
.relgroup table.led { width:100%; table-layout:fixed; }
.relgroup table.led td.bomthumb { width:52px; }
.relgroup table.led td:last-child { width:74px; text-align:right; vertical-align:top; }
.relhome .mono { color:var(--ink-3); }
/* a checklist line attested BY REFERENCE */
.evref { display:inline-flex; align-items:baseline; gap:4px; flex-wrap:wrap;
         border:1px solid var(--st-released); background:var(--st-released-bg);
         color:var(--ink-2); border-radius:2px; padding:1px 6px; cursor:help; }
.evref a.num { font-weight:600; }
.evref .resultchip { margin-left:2px; }
.doc.wf .wfrow .evbtn { display:inline-flex; align-items:center; gap:4px;
                        margin-top:6px; align-self:flex-start; }
.doc.wf .wfrow .evbtn b { font:600 11.5px var(--mono); }
/* the project page */
.projlink { font:11px var(--mono); color:var(--ink-3); }
.modechip { font:600 11px var(--mono); letter-spacing:.08em; text-transform:uppercase;
            border:1px solid currentColor; border-radius:2px; padding:1px 7px; }
.modechip.m-off   { color:var(--st-draft); }
.modechip.m-read  { color:var(--blue); background:var(--blue-bg); }
.modechip.m-write { color:var(--st-released); background:var(--st-released-bg); }
.flipgrid { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; margin-top:20px;
            align-items:start; }
.flipgrid > .doc { min-width:0; }
.doc.flip { border-width:2px; }
.doc.flip.ok    { border-color:var(--st-released); }
.doc.flip.warn  { border-color:var(--st-prototype); }
.doc.flip.block { border-color:var(--st-obsolete); }
.doc.flip > h3 .verdict { font:600 11px var(--mono); text-transform:none; letter-spacing:0; }
.doc.flip.ok    > h3 .verdict { color:var(--st-released); }
.doc.flip.warn  > h3 .verdict { color:var(--st-prototype); }
.doc.flip.block > h3 .verdict { color:var(--st-obsolete); }
.doc.flip .now { font:12px var(--mono); color:var(--ink-2); margin:0 0 10px; }
.doc.flip .lbl { margin:12px 0 5px; }
.doc.flip ul.will { margin:0; padding-left:18px; font-size:13px; line-height:1.5; }
.doc.flip ul.will li { margin:2px 0; }
.finding { display:flex; gap:9px; padding:7px 0; border-top:1px solid var(--rule);
           font-size:13px; line-height:1.45; }
.finding .lvl { font:600 10px/1.7 var(--mono); text-transform:uppercase; width:4.2em;
                flex:none; letter-spacing:.06em; }
.finding.block .lvl { color:var(--st-obsolete); }
.finding.warn  .lvl { color:var(--st-prototype); }
.finding.info  .lvl { color:var(--ink-3); }
.finding .txt { min-width:0; flex:1; }
.finding .fix { margin-top:4px; font-size:12px; }
.finding .fix code, .doc.flip .cmd code { font:11.5px var(--mono); overflow-wrap:anywhere;
                                           background:var(--paper); padding:1px 4px; }
.doc.flip .cmd { margin-top:12px; border-top:1px solid var(--rule); padding-top:4px; }
.doc.flip .cmd code { display:block; padding:6px 8px; }
details.items > summary { cursor:pointer; font:11.5px var(--mono); color:var(--ink-2);
                          margin-top:4px; }
details.items ul { margin:4px 0 0; padding-left:18px; font:11.5px/1.5 var(--mono);
                   color:var(--ink-2); overflow-wrap:anywhere; }
details.items.pad { padding:4px 12px 8px; }
table.kvt { width:100%; }
table.kvt td.mono { font:12px var(--mono); text-align:right; }
.dim.small { font-size:11.5px; }
@media (max-width:760px) {
  .flipgrid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="mast">
  <div class="title"><a href="/">plm</a> <span class="reg">— part registry</span></div>
  <nav id="mastNav">
    <a href="/" data-nav="dash">Dashboard</a>
    <a href="/registry" data-nav="registry">Registry</a>
    <a href="/pulls" data-nav="approvals">Pull requests</a>
  </nav>
  <!-- The bell (§2.9): the approvals count, and a dropdown of what is waiting
       on you — web/changes.js installs it. -->
  <button id="bell" type="button" aria-haspopup="menu" aria-expanded="false" title="Waiting on you">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 16a2 2 0 0 0 1.985-1.75c.017-.137-.097-.25-.235-.25h-3.5c-.138 0-.252.113-.235.25A2 2 0 0 0 8 16ZM3 5a5 5 0 0 1 10 0v2.947c0 .05.015.098.042.139l1.703 2.555A1.519 1.519 0 0 1 13.482 13H2.518a1.516 1.516 0 0 1-1.263-2.36l1.703-2.554A.255.255 0 0 0 3 7.947Zm5-3.5A3.5 3.5 0 0 0 4.5 5v2.947c0 .346-.102.683-.294.97l-1.703 2.556a.017.017 0 0 0-.003.01l.001.006c0 .002.002.004.004.006l.006.004.007.001h10.964l.007-.001.006-.004.004-.006.001-.007a.017.017 0 0 0-.003-.01l-1.703-2.554a1.745 1.745 0 0 1-.294-.97V5A3.5 3.5 0 0 0 8 1.5Z"/></svg>
    <span id="apprCount" class="badge hide"></span>
  </button>
  <input id="gq" placeholder="Search parts, pull requests, context…" autocomplete="off">
  <span id="instanceBadge" class="hide"></span>
  <div class="stats" id="mastStats"></div>
  <div class="spacer"></div>
  <div class="who" id="whoami"></div>
  <div class="api">/api</div>
</div>

<div id="page"></div>
<div id="toast" role="status"></div>

<div id="viewer" aria-hidden="true">
  <div id="vbox">
    <div id="vcanvas">
      <div id="vhud"></div>
      <div id="vbusy">loading geometry…</div>
    </div>
    <button id="vfull" title="Full screen (Esc leaves)">⛶</button>
    <button id="vclose">Close ✕</button>
    <!-- Phone only: the panel (explode slider, bodies list) stacks UNDER the
         canvas and starts collapsed, so the part gets the screen. This strip
         is the panel's header and its toggle. -->
    <button id="vptoggle" aria-expanded="false" aria-controls="vpanel">Parts &amp; controls</button>
    <div id="vpanel"></div>
  </div>
</div>

<div id="lbox" aria-hidden="true">
  <div id="lbbox" role="dialog" aria-modal="true" aria-labelledby="lbname">
    <div id="lbhead">
      <span class="nm" id="lbname"></span>
      <span class="rolechip" id="lbrole"></span>
      <span class="sz" id="lbsize"></span>
      <span class="spacer"></span>
      <!-- The SAME ⋯ menu every file row has: download, copy link, compare
           with another ref, send to the build plate. A preview is a way of
           looking at a file, not a different file. -->
      <span id="lbmenu"></span>
      <button class="btn" id="lbclose">Close ✕</button>
    </div>
    <div id="lbbody"></div>
  </div>
</div>

<!-- Every URL here is ABSOLUTE (stage 22): the shell is served at /N/compare/a...b
     too, where a relative `app.js` would resolve to /N/compare/app.js. -->
<script src="/vendor/three.min.js"></script>
<script src="/vendor/OrbitControls.js"></script>
<script src="/vendor/STLLoader.js"></script>
<script>
// app.js is loaded with a cache-busting query on purpose. It changes several
// times a day, is served by StaticFiles with no explicit Cache-Control, and a
// browser that heuristically caches it shows a UI whose JS predates the fix it
// is being told to look at — which cost Geoff two rounds of "it's still black"
// on 2026-08-13 while the deployed code was correct. 120 KB uncached per load
// is the right price for never debugging a stale bundle again.
(function () {
  // STAGE 22: the URL table (web/routes.js) — pure functions the router and
  // every link builder in app.js / changes.js use. First, in order.
  var rt = document.createElement('script');
  rt.src = '/routes.js?v=' + Date.now();
  rt.async = false;
  document.body.appendChild(rt);
  // STAGE 13: review threads (web/review.js) — self-contained like checks.js.
  // Loaded BEFORE app.js and in order (async=false), because the proposal
  // page asks `window.REVIEW_UI` the moment app.js routes.
  var rv = document.createElement('script');
  rv.src = '/review.js?v=' + Date.now();
  rv.async = false;
  document.body.appendChild(rv);
  // STAGE 14: changes + release sets (web/changes.js) — same pattern, same
  // reason: the router asks `window.CHANGES_UI` the moment app.js routes.
  // §2.9: the DIFF-FORM registry (web/diffwidgets.js) — every changed file on
  // the change page, the compare page and the proposal page draws through it.
  var dw = document.createElement('script');
  dw.src = '/diffwidgets.js?v=' + Date.now();
  dw.async = false;
  document.body.appendChild(dw);
  var ch = document.createElement('script');
  ch.src = '/changes.js?v=' + Date.now();
  ch.async = false;
  document.body.appendChild(ch);
  var s = document.createElement('script');
  s.src = '/app.js?v=' + Date.now();
  s.async = false;
  document.body.appendChild(s);
  // STAGE 6 HOOK: checks (PLM_REVIEW_MODEL §2.6). Self-contained — its own CSS,
  // one `window.CHECKS` global, and two one-line mount calls in app.js.
  var c = document.createElement('script');
  c.src = '/checks.js?v=' + Date.now();
  document.body.appendChild(c);
  var f = document.createElement('script');       // the flat pattern viewer
  f.src = '/flat.js?v=' + Date.now();
  document.body.appendChild(f);
})();
</script>
</body>
</html>
